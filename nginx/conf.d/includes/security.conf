# Headers suggested online to improve security
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
# The third-party origins below are the ones the portal actually loads:
#   fonts.googleapis.com  stylesheet @import in maintainer-site
#   fonts.gstatic.com     the font files that stylesheet then pulls
#   cdn.jsdelivr.net      simple-icons SVGs and a webfont stylesheet, same app
#   cdn.rawgit.com        the devicon stylesheet and its fonts, same app
#   www.youtube.com       one embedded iframe in file-manager
# 'unsafe-inline' and 'unsafe-eval' are still here because the bundles need
# them; removing those needs frontend work rather than a change to this file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdn.rawgit.com; img-src 'self' data: blob: https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdn.rawgit.com; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob: https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
