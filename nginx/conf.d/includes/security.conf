# Headers suggested online to improve security
#
# Only the headers that Omniport itself cannot send belong here. Django emits
# X-Frame-Options, X-Content-Type-Options, Referrer-Policy and, on secure
# responses, Strict-Transport-Security from its own settings, and add_header
# appends to the response rather than replacing what is already on it, so
# listing those here would send each of them twice, with conflicting values.
#
# This is included at the server level, and so applies to the responses that
# are proxied to the application server. The responses NGINX serves itself get
# security_assets.conf instead, that being the only way to have them carry the
# four headers Django is not there to send.
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src * blob: data: 'unsafe-eval' 'unsafe-inline'" always;
