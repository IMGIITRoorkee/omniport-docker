# Headers suggested online to improve security
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
# Enforced now because none of the three governs a subresource load: nothing in
# the deployed bundles uses <object>, <embed> or <base>.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
# Reported first because a blocked subresource fails silently, in the console
# only, across around fifty separately built bundles. Violations surface in each
# browser's console and are not collected anywhere, so staging has to be walked
# rather than watched. Rename this header to
# Content-Security-Policy to enforce it; tests/test_security_headers.py lists
# every origin below against the file that loads it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com https://cdn.jsdelivr.net https://cdn.rawgit.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.cdnfonts.com https://cdn.jsdelivr.net; media-src 'self' data: blob:; connect-src 'self' https://en.gravatar.com https://tenor.googleapis.com https://fcm.googleapis.com; frame-src 'self' blob: https://www.youtube.com https://open.spotify.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
