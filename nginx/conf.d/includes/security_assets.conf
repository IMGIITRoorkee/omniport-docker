# Headers suggested online to improve security, for the responses NGINX serves
# from disk without ever consulting the application server
#
# These never pass through Django, so NGINX is the only thing that can put the
# headers on them. The two from security.conf are repeated because add_header
# is inherited from the enclosing level only where the current level declares
# none of its own, so a location including this file would otherwise lose them.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src * blob: data: 'unsafe-eval' 'unsafe-inline'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
